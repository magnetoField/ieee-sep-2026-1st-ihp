<rect x="250" y="255" width="185" height="85" fill="#f8f9fa"/><rect x="490" y="255" width="190" height="85" fill="#f8f9fa"/>
<rect x="805" y="180" width="130" height="90"/>
<g marker-end="url(#a)"><path d="M155 125H250"/><path d="M250 155H155"/><path d="M435 140H490"/><path d="M342 180V255"/><path d="M250 310H155"/><path d="M585 180V255"/><path d="M680 280H755V240H805"/><path d="M805 205H755V130H680"/></g>
