<g font-family="Arial, sans-serif" fill="#202122" text-anchor="middle" font-size="15">
<text x="265" y="66" font-weight="bold">IEEE DOORSH</text>
<text x="90" y="131">Klawiatura</text><text x="90" y="154">4 × 4</text><text x="90" y="316">Buzzer / driver</text>
<text x="342" y="131">Klawiatura i PIN</text><text x="342" y="155" font-size="12">filtr gestów · limit prób</text>
<text x="585" y="131">Obsługa sesji</text><text x="585" y="155" font-size="12">SHIFT64 · timeout</text>
<text x="342" y="292">Sygnalizacja</text><text x="342" y="315" font-size="12">potwierdzenie klawisza</text>
<text x="585" y="289">SIMON64/128</text><text x="585" y="313" font-size="12">jeden klucz · 44 rundy</text>
<text x="870" y="219">Host</text><text x="870" y="241" font-size="12">weryfikacja odpowiedzi</text>
<text x="199" y="117" font-size="10">C0…C3</text><text x="199" y="171" font-size="10">R0…R3</text>
<text x="771" y="106" font-size="11">SDI / SCLK / CS_n</text><text x="785" y="303" font-size="11">SDO / READY</text>
<text x="470" y="424" font-size="12">CLK · RESET_n · ENABLE</text>
</g></svg>
