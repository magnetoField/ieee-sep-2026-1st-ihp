<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">IEEE DOORSH — schemat funkcjonalny</title><desc id="desc">Klawiatura i buzzer po lewej, funkcje PIN i szyfrowania wewnątrz granicy układu, interfejs i host po prawej.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#202122"/></marker></defs>
