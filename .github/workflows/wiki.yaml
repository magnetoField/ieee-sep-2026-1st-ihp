name: wiki
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wiki/requirements-lock.txt
      - run: python -m pip install -r wiki/requirements-lock.txt
      - run: make wiki-build WIKI_PYTHON=python
      - run: python scripts/check_wiki.py
      - uses: actions/upload-artifact@v7
        with:
          name: chip-d6-wiki
          path: wiki/site/
          if-no-files-found: error
